<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1512">
<meta name="referrer" content="no-referrer">
<title>SIM CARD GAME</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b1512;--surface:#14231d;--line:#2c4138;--ink:#f2f5ec;--muted:#a6b9ae;--mint:#9eeacd;--gold:#f0d194}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#18332a,transparent 520px),var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}
button,select{font:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
[hidden]{display:none!important}
.app{width:min(100%,570px);margin:auto;padding:max(14px,env(safe-area-inset-top),var(--tg-content-safe-area-inset-top,0px)) 14px max(18px,env(safe-area-inset-bottom),var(--tg-content-safe-area-inset-bottom,0px))}
.top,.split{display:flex;justify-content:space-between;align-items:center;gap:9px}
.top{margin-bottom:14px}
.brand{margin:0;font-size:clamp(17px,5vw,26px);letter-spacing:-.07em;font-weight:900}
.brand b{color:var(--mint)}
.top span{max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.wallet,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.metric,.panel{min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px}
.metric span,.sub,.meta{color:var(--muted);font-size:11px}
.metric strong{display:block;color:var(--gold);font-size:clamp(12px,4vw,18px);overflow-wrap:anywhere}
.metric:last-child strong{color:var(--mint)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:12px 0;padding:4px;border:1px solid var(--line);border-radius:12px;background:#0d1a15}
.tab{min-height:42px;padding:4px;border:0;border-radius:8px;color:var(--muted);background:none;font-weight:750;cursor:pointer}
.tab[aria-pressed=true]{background:#29493a;color:var(--mint)}
.panel{margin:9px 0}
h2{margin:0 0 8px;font-size:16px}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;margin:10px 0}
.controls select{min-width:0;width:100%;padding:0 6px;border:1px solid var(--line);background:#10201a;color:var(--ink);border-radius:9px}
.btn{min-height:42px;padding:6px 9px;border:1px solid #3e6454;border-radius:9px;background:#23483a;color:#e7fff0;font-weight:760;cursor:pointer;touch-action:manipulation}
.btn.primary{border-color:var(--mint);background:var(--mint);color:#0d241a}
.btn:disabled{opacity:.55;cursor:wait}
.notice{margin:8px 0;padding:10px;border-radius:10px;background:#24382e;color:#d7f3e4;overflow-wrap:anywhere}
.notice:empty{display:none}
.sim{--rim:#d6dfd8;position:relative;isolation:isolate;display:grid;align-content:space-between;min-width:0;min-height:90px;padding:9px;border-radius:11px;background:radial-gradient(ellipse at 98% 0,color-mix(in srgb,var(--rim) 36%,transparent),transparent 62%),#181f1c;border:1px solid color-mix(in srgb,var(--rim) 60%,#24312a)}
.sim.rare{--rim:#81bfff}.sim.epic{--rim:#c79eff}.sim.legendary{--rim:#80d9ff}.sim.mythic{--rim:#ff7794}.sim.secret{--rim:#aef3aa}
.sim strong{display:block;font:800 clamp(11px,3.3vw,19px)/1.25 ui-monospace,monospace;overflow-wrap:anywhere}
.sim small{color:var(--rim);font-size:10px}
.chip{display:block;width:17px;height:13px;border-radius:3px;background:linear-gradient(135deg,#ffe8a1,#ad8845)}
.deal{min-width:0;display:grid;gap:5px}
.deal .actions{display:flex;gap:4px}
.deal .actions button{flex:1;padding-inline:4px;font-size:11px;overflow-wrap:anywhere}
.rank{display:grid;grid-template-columns:27px minmax(0,1fr) auto;gap:6px;align-items:center;padding:9px;border-bottom:1px solid var(--line)}
.rank span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank strong{color:var(--gold);font-size:12px}
.rank.me{background:#1b3127;border-radius:8px}
#rollPreview .sim{min-height:130px;margin-bottom:8px;animation:reveal .28s ease-out}
@keyframes reveal{from{opacity:.45;transform:translateY(5px)}}
@media(max-width:350px){.controls{grid-template-columns:1fr 1fr}.controls select{grid-column:1/-1;min-height:42px}.deal .actions{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){#rollPreview .sim{animation:none}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><h1 class="brand">SIM CARD <b>GAME</b></h1><span id="playerName"></span></header>
  <div id="notice" class="notice" role="status">Проверяем вход через Telegram…</div>
  <button id="retry" class="btn" type="button" hidden>Повторить запрос</button>
  <div id="game" hidden>
    <div class="wallet">
      <div class="metric"><span>Игровой баланс</span><strong id="balance"></strong></div>
      <div class="metric"><span>Кристаллы</span><strong id="crystals"></strong></div>
    </div>
    <nav class="tabs" aria-label="Разделы игры">
      <button type="button" class="tab" data-page="roll" aria-pressed="true">Крутка</button>
      <button type="button" class="tab" data-page="collection" aria-pressed="false">Коллекция</button>
      <button type="button" class="tab" data-page="rank" aria-pressed="false">Рейтинг</button>
    </nav>
    <section id="roll">
      <div class="panel">
        <div class="split"><h2>Крутка номера</h2><span class="meta" id="experience"></span></div>
        <div id="rollPreview"></div>
        <div class="controls">
          <select id="tariff" aria-label="Тариф"></select>
          <button class="btn primary" data-roll="1" type="button">×1</button>
          <button class="btn" data-roll="5" type="button">×5</button>
        </div>
      </div>
      <div class="panel"><h2>Выпавшие номера</h2><div id="pendingNumbers" class="grid"></div></div>
    </section>
    <section id="collection" hidden>
      <div class="panel"><div class="split"><h2>Коллекция</h2><span id="collectionCount" class="meta"></span></div><div id="savedNumbers" class="grid"></div></div>
    </section>
    <section id="rank" hidden>
      <div class="panel"><div class="split"><h2>Рейтинг по балансу</h2><button id="refresh" class="btn" type="button">Обновить</button></div><div id="leaderboard"></div></div>
    </section>
  </div>
</main>
<script>
(() => {
  "use strict";
  const endpoint = "https://wftudhjdehkdhcmtcjkl.supabase.co/functions/v1/telegram-game";
  const telegram = window.Telegram?.WebApp;
  const $ = id => document.getElementById(id);
  const money = value => Number(value || 0).toLocaleString("ru-RU") + " ₽";
  const fmt = value => Number(value || 0).toLocaleString("ru-RU");
  const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  const rarities = {common:"Обычный",rare:"Редкий",epic:"Эпический",legendary:"Легендарный",mythic:"Мифический",secret:"Суперсекретный"};
  let session = "", current, pending, busy = false;

  function notice(message, retry = false) {
    $("notice").textContent = message;
    $("retry").hidden = !retry;
  }
  async function api(body) {
    let response, data;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 18000);
    try {
      response = await fetch(endpoint, {method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify(body), cache:"no-store", referrerPolicy:"no-referrer", signal:controller.signal});
      data = await response.json();
    } catch {
      throw new Error("Связь с сервером прервалась. Повтори запрос.");
    } finally {
      clearTimeout(timeout);
    }
    if (!response.ok) throw Object.assign(new Error(data?.error || "Сервер временно недоступен."), { status: response.status });
    return data;
  }
  function card(number) {
    const key = Object.hasOwn(rarities, number.rarity) ? number.rarity : "common";
    return `<div class="sim ${key}"><div class="split"><small>${rarities[key]}</small><span class="chip" aria-hidden="true"></span></div>
      <strong>${esc(number.formatted)}</strong><small>${money(number.price)}</small></div>`;
  }
  function renderDeals(items, canSave) {
    return items.length ? items.map(n => `<div class="deal">${card(n)}<div class="actions">
      ${canSave ? `<button type="button" class="btn" data-action="save" data-id="${esc(n.id)}">Сохранить</button>` : ""}
      <button type="button" class="btn" data-action="sell" data-id="${esc(n.id)}">Продать</button></div></div>`).join("")
      : '<p class="sub">Здесь пока нет номеров.</p>';
  }
  function updateButtons() {
    document.querySelectorAll("[data-action],[data-roll],#refresh").forEach(button => { button.disabled = !session || busy || Boolean(pending); });
    $("retry").disabled = busy;
  }
  function render(data) {
    current = data;
    $("game").hidden = false;
    $("playerName").textContent = data.player.name;
    $("balance").textContent = money(data.player.balance);
    $("crystals").textContent = fmt(data.player.crystals) + " ◆";
    $("experience").textContent = fmt(data.player.xp) + " XP";
    const choice = $("tariff").value;
    $("tariff").replaceChildren(...data.tariffs.map(t => new Option(t.name + " · " + money(t.cost), t.id)));
    if (data.tariffs.some(t => t.id === choice)) $("tariff").value = choice;
    const saved = data.numbers.filter(n => n.status === "saved"), fresh = data.numbers.filter(n => n.status === "rolled");
    $("collectionCount").textContent = saved.length + " / 100";
    $("pendingNumbers").innerHTML = renderDeals(fresh, true);
    $("savedNumbers").innerHTML = renderDeals(saved, false);
    const latest = data.rolled?.at(-1) || fresh[0];
    $("rollPreview").innerHTML = latest ? card(latest) : '<p class="sub">Выбери тариф и нажми ×1 или ×5.</p>';
    $("leaderboard").innerHTML = data.leaderboard.map((p, i) =>
      `<div class="rank${p.isMe ? " me" : ""}"><span>${i + 1}</span><span>${esc(p.name)}${p.isMe ? " · Вы" : ""}</span>
      <strong>${money(p.balance)}</strong></div>`).join("");
    updateButtons();
  }
  async function login() {
    if (busy) return;
    if (!telegram?.initData) {
      notice("Открой эту игру кнопкой Mini App в Telegram.");
      return;
    }
    busy = true;
    updateButtons();
    try {
      const data = await api({action:"login",initData:telegram.initData});
      session = data.session;
      render(data);
      notice("");
    } catch (error) {
      notice(error.message, error.status !== 401);
    } finally { busy = false; updateButtons(); }
  }
  async function requestAction() {
    if (!pending || busy) return;
    busy = true;
    updateButtons();
    try {
      const data = await api({...pending,session});
      const action = pending.action;
      pending = null;
      render(data);
      notice(action === "sell" ? "Начислено " + money(data.credited) : action === "save" ? "Номер сохранён" : "");
      if (action === "roll") {
        try { telegram?.HapticFeedback?.impactOccurred("light"); } catch {}
      }
    } catch (error) {
      if (error.status >= 400 && error.status < 500) pending = null;
      if (error.status === 401) session = "";
      notice(error.message, Boolean(pending));
    } finally { busy = false; updateButtons(); }
  }
  document.addEventListener("click", event => {
    const page = event.target.closest("button[data-page]");
    if (page) {
      document.querySelectorAll("button[data-page]").forEach(tab => {
        const active = tab === page;
        tab.setAttribute("aria-pressed", String(active));
        $(tab.dataset.page).hidden = !active;
      });
      return;
    }
    if (!session || busy || pending || !current) return;
    const roll = event.target.closest("[data-roll]"), asset = event.target.closest("[data-action]");
    if (roll) pending = {action:"roll", tariff:$("tariff").value, count:Number(roll.dataset.roll), requestId:crypto.randomUUID()};
    if (asset) pending = {action:asset.dataset.action,numberId:asset.dataset.id,requestId:crypto.randomUUID()};
    if (event.target.closest("#refresh")) pending = {action:"state"};
    if (pending) void requestAction();
  });
  $("retry").addEventListener("click", () => { if (pending) void requestAction(); else void login(); });
  try {
    telegram?.ready();
    telegram?.expand();
    telegram?.setHeaderColor?.("#0b1512");
    telegram?.setBackgroundColor?.("#0b1512");
  } catch {}
  void login();
})();
</script>
</body>
</html>
